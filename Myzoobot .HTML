<html>
    <head>
        <title>My zoo</title>

        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                background-color: aliceblue;
                text-align: center;
                padding: 30px;
            }
            h1 {
                color: #ff5a43;
            }

            #zoo{
                border: 2px solid #ff5a43;
                width: 300px;
                margin: 16px auto;
                padding: 8px;
                border-radius: 10px ;
                color: white;
            }
            .zone{
                 border: 1px solid #ff5a43;
                 margin: 6px 0;
                 padding: 10px 24px;
                 border: none;
                 border-radius: 6px;
                 text-align: left;
            }
            button{
                background: #ff5a43;
                color: white;
                padding: 10px 24px;
                border: none;
                border-radius: 20px;
                cursor: pointer;
            }
        </style>
    </head>

    <body>
        <h1>MY zoo</h1>
        <p>use of java script and dom</p>
        <div id="zoo">
            <div class="zone">ZONE1 <span id="zone1"></span> </div>
            <div class="zone">ZONE2 <span id="zone2"></span> </div>
            <div class="zone">ZONE3 <span id="zone3"></span> </div>
            <div class="zone">total animals <span id="total"></span> </div>
        </div>
        <br> 
        <button onclick ="openZoo()"> open the zoo</button>
        <p id="zoo-states"></p>

        <script>function openZoo() {

     /* Task 1: Add your first animal to Zone 1 */

     document.getElementById("zone1").innerHTML = "Lion";

     /* Task 2: Add your second animal to Zone 2 */

     document.getElementById("zone2").innerHTML = "Elephant";

     /* Task 3: Add your third animal to Zone 3 */

     document.getElementById("zone3").innerHTML = "Penguin";

     /* Task 4: Show the total number of animals */

     document.getElementById("total").innerHTML = "3";

     /* Task 5: Change the zoo background colour */

     document.getElementById("zoo").style.backgroundColor = "lightgreen";

     /* Task 6: Use the document object to show the page title */

     document.getElementById("zoo-status").innerHTML = document.title + " is now open!";

   } 
   </script>
    </body>
</html>
