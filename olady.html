
<head>

<style>
    body{
        font-family: 'Open Sans',sans-serif;
        background-color: black;
    }
    #container{
        width: 1000px;
        height: 550px;
        background-image: linear-gradient(rgba(0,0,0.3),rgba(0,0,0.3)),url(gvvgvg.png);
        margin: 20px auto;
    }

    #calculater{
        width: 320px;
        height: 520px;
        background-color: #eaedef;
        margin: 0 auto;
        top: 20px;
        position: relative;
        border-radius: 5px;
        box-shadow: 4px 8px 0 rgba(0,0,0.2), 6px 20px 0 rgba(0,0,0,0.19);
    }
    #resulet{
        height: 120px;
    }
    #keyboard{
        height: 400px;
    }

    .operation,.number, .empty{
        width: 50px;
        height: 50px;
        margin: 15px;
        float: left;
        border-radius: 50% ;
        border-width: 0;
        font-weight: bold;
        font-size: 15px;
    }
    .number ,.empty{
        background-color: #eaedef;
    }
    .number,.operator{
        cursor: pointer;
    }
    .operator.active, .number.active{
        font-size: 13px;
    }
    .operator:focus, .number:focus, .empty:focus{
        outline: 0;
    }
</style>

<link href="https://fonts.googleapis.com/css?family=Open+Sans:600,700" rel="stylesheet">

<title>A simple calculator</title>

</head>

<body>
    <div id="container">
        <div id="calculater">
            <div id="result">
                <div id="history">
                    <p id="history-value"></p>
                </div>
                <div id="output">
                    <p id="output-value"></p>
                </div>
            </div>

            <div id="keyboard">
                <button class="operater" id="clear">C</button>
                <button class="operater" id="backspace">CE</button>
                <button class="operater" id="%">%</button>
                <button class="operater" id="/">/</button>
                <button class="number" id="7">7</button>
                <button class="number" id="8">8</button>
                <button class="number" id="9">9</button>
                <button class="operater" id="*">*</button>
                <button class="number" id="4">4</button>
                <button class="number" id="5">5</button>
                <button class="number" id="6">6</button>
                <button class="operater" id="-"></button>
                <button class="number" id="1">1</button>
                <button class="number" id="2">2</button>
                <button class="number" id="3">3</button>
                <button class="operater" id="+">+</button>
                <button class="empty" id="empty"></button>
                <button class="number" id="">0</button>
                <button class="empty" id="empty"></button>
                <button class="operater" id="">=</button>
            </div>
        </div>
    </div>
</body>
