<html>
    <head>
        <title>My animal fact file</title>
        <style>
            
            
            body{
                background-color: darkgreen;
                font-family: Arial, Helvetica, sans-serif;
            }
            .fact-file {
                background-color: lightyellow;
                color: darkslategray;
                width: 260px;
                padding: 25px;
                border: 4px solid forestgreen;
                margin: 30px;
            }

            .animal-name{
                color: forestgreen;
                font-size: 22px;
            }
            .detail{
                color: aliceblue;
            }
            .cool-fact{
                color: darkorange;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <div class="fact-file">
            <h2 class="animal-name">Snow Leopard</h2>
            <p class="detail">type : big cat</p>
            <p class="detail"> lives in: mountain ranges </p>
            <p class="cool-fact"> Cool-fact : Can leap up to 15 mts in one jump</p>
        </div>
    </body>
</html>
